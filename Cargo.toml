[package]
name = "vue2qml"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A corpus-driven Vue single-file component to QML converter"
license = "MIT"
repository = "https://github.com/sfg5453/vue2qml"
homepage = "https://github.com/sfg5453/vue2qml"
keywords = ["vue", "qml", "qt", "converter", "rust"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "vue2qml"
path = "src/lib.rs"

[[bin]]
name = "vue2qml"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
all = "deny"
